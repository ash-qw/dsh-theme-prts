name: Publish public npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'ash-qw/dsh-theme-prts'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        run: node -e "const { version } = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + version) { throw new Error('Tag must be v' + version) }"

      - name: Install dependencies
        run: npm ci

      - name: Publish package with npm Trusted Publishing
        run: npm publish --access public --provenance
